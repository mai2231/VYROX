<!-- @title: Shop All — VYROX @desc: Filter the full VYROX catalogue by category, price, rating and availability. @page: shop -->

<section class="border-b border-line bg-ink py-12 text-white sm:py-16">
  <div class="container-vyrox">
    <nav class="breadcrumb !text-white/50" aria-label="Breadcrumb"><a href="{{ROOT}}index.html" class="hover:text-white">Home</a><span>/</span><span class="text-white">Shop</span></nav>
    <div class="mt-6 flex flex-wrap items-end justify-between gap-6">
      <div>
        <p class="eyebrow !text-red-bright">The full edit</p>
        <h1 class="display-xl mt-3" data-shop-heading>SHOP ALL</h1>
        <p class="mt-3 max-w-lg text-sm text-white/60">Every piece, every category. Filter it until it is exactly yours.</p>
      </div>
      <p class="border border-white/20 px-4 py-2 text-[10px] font-bold uppercase tracking-wide2 text-white/70"><span data-shop-count>24 products</span></p>
    </div>
  </div>
</section>

<section class="section-tight">
  <div class="container-vyrox flex gap-8">
    <aside class="shop-filters fixed inset-y-0 left-0 z-[75] w-[86%] max-w-sm shrink-0 -translate-x-full overflow-y-auto border-r border-line bg-surface p-5 transition-transform duration-300 lg:sticky lg:top-[104px] lg:z-0 lg:block lg:h-fit lg:w-60 lg:max-w-none lg:translate-x-0 lg:border-r-0 lg:bg-transparent lg:p-0" data-shop-filters aria-label="Product filters">
      <div class="mb-5 flex items-center justify-between lg:hidden">
        <p class="font-display text-2xl uppercase">Filters</p>
        <button type="button" class="icon-btn" data-shop-filter-close aria-label="Close filters"><svg class="h-5 w-5" aria-hidden="true"><use href="{{ROOT}}assets/icons/lucide-sprite.svg#i-x"></use></svg></button>
      </div>

      <form id="shop-filters-form" class="space-y-7" data-shop-search-form>
        <div>
          <label for="shop-search" class="label">Search</label>
          <div class="relative">
            <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-subtle" aria-hidden="true"><use href="{{ROOT}}assets/icons/lucide-sprite.svg#i-search"></use></svg>
            <input id="shop-search" type="search" data-shop-search class="input input-sm pl-9" placeholder="Search the catalogue" autocomplete="off">
          </div>
        </div>

        <fieldset>
          <legend class="label">Category</legend>
          <div class="space-y-2">
            <label class="flex cursor-pointer items-center gap-2.5 text-xs"><input type="radio" name="category" value="all" data-filter-category data-label="Shop all" class="radio-dot" checked><span>All products</span></label>
            <label class="flex cursor-pointer items-center gap-2.5 text-xs"><input type="radio" name="category" value="fashion" data-filter-category data-label="Fashion" class="radio-dot"><span>Fashion &amp; Clothing</span></label>
            <label class="flex cursor-pointer items-center gap-2.5 text-xs"><input type="radio" name="category" value="electronics" data-filter-category data-label="Electronics" class="radio-dot"><span>Electronics &amp; Gadgets</span></label>
            <label class="flex cursor-pointer items-center gap-2.5 text-xs"><input type="radio" name="category" value="accessories" data-filter-category data-label="Accessories" class="radio-dot"><span>Accessories</span></label>
            <label class="flex cursor-pointer items-center gap-2.5 text-xs"><input type="radio" name="category" value="beauty" data-filter-category data-label="Beauty" class="radio-dot"><span>Beauty &amp; Personal Care</span></label>
            <label class="flex cursor-pointer items-center gap-2.5 text-xs"><input type="radio" name="category" value="home" data-filter-category data-label="Home & Living" class="radio-dot"><span>Home &amp; Living</span></label>
            <label class="flex cursor-pointer items-center gap-2.5 text-xs"><input type="radio" name="category" value="lifestyle" data-filter-category data-label="Lifestyle" class="radio-dot"><span>Lifestyle</span></label>
            <label class="flex cursor-pointer items-center gap-2.5 text-xs"><input type="radio" name="category" value="sports" data-filter-category data-label="Sports & Fitness" class="radio-dot"><span>Sports &amp; Fitness</span></label>
            <label class="flex cursor-pointer items-center gap-2.5 text-xs"><input type="radio" name="category" value="general" data-filter-category data-label="Essentials" class="radio-dot"><span>Essentials</span></label>
          </div>
        </fieldset>

        <fieldset>
          <legend class="label">Price range (₱)</legend>
          <div class="grid grid-cols-2 gap-2">
            <div><label for="price-min" class="sr-only">Minimum price</label><input id="price-min" type="number" min="0" step="100" placeholder="Min" data-filter-min class="input input-sm"></div>
            <div><label for="price-max" class="sr-only">Maximum price</label><input id="price-max" type="number" min="0" step="100" placeholder="Max" data-filter-max class="input input-sm"></div>
          </div>
        </fieldset>

        <fieldset>
          <legend class="label">Rating</legend>
          <div class="space-y-2">
            <label class="flex cursor-pointer items-center gap-2.5 text-xs"><input type="radio" name="rating" value="0" data-filter-rating class="radio-dot" checked><span>Any rating</span></label>
            <label class="flex cursor-pointer items-center gap-2.5 text-xs"><input type="radio" name="rating" value="4" data-filter-rating class="radio-dot"><span>4★ &amp; up</span></label>
            <label class="flex cursor-pointer items-center gap-2.5 text-xs"><input type="radio" name="rating" value="4.5" data-filter-rating class="radio-dot"><span>4.5★ &amp; up</span></label>
          </div>
        </fieldset>

        <fieldset class="space-y-2.5">
          <legend class="label">Availability</legend>
          <label class="flex cursor-pointer items-center gap-2.5 text-xs"><input type="checkbox" data-filter-stock class="checkbox"><span>In stock only</span></label>
          <label class="flex cursor-pointer items-center gap-2.5 text-xs"><input type="checkbox" data-filter-sale class="checkbox"><span>On sale</span></label>
        </fieldset>

        <button type="submit" class="btn btn-dark btn-block btn-sm lg:hidden">Apply filters</button>
      </form>

      <div class="mt-7 border-t border-line pt-5">
        <p class="text-[10px] uppercase tracking-wide2 text-subtle">Demo tip</p>
        <p class="mt-2 text-[11px] leading-relaxed text-subtle">Try <strong class="text-body">VYROX10</strong> at checkout for 10% off, capped at ₱500.</p>
      </div>
    </aside>

    <div class="min-w-0 flex-1">
      <div class="flex flex-wrap items-center gap-3 border-y border-line py-3">
        <button type="button" class="chip lg:hidden" data-shop-filter-toggle aria-expanded="false" aria-controls="shop-filters-form">
          <svg class="h-3.5 w-3.5" aria-hidden="true"><use href="{{ROOT}}assets/icons/lucide-sprite.svg#i-filter"></use></svg> Filters
          <span class="hidden h-5 min-w-5 items-center justify-center rounded-full bg-red px-1 text-[9px] text-white" data-filter-count>0</span>
        </button>
        <p class="ml-auto hidden text-[10px] uppercase tracking-wide2 text-subtle sm:block"><span data-shop-count>24 products</span></p>
        <label for="shop-sort" class="sr-only">Sort products</label>
        <select id="shop-sort" data-shop-sort class="input input-sm w-auto min-w-[180px]">
          <option value="featured">Featured</option>
          <option value="newest">Newest</option>
          <option value="popular">Best selling</option>
          <option value="rating">Top rated</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
        </select>
        <div class="hidden items-center gap-1 border border-line p-1 sm:flex">
          <button type="button" class="flex h-7 w-7 items-center justify-center chip-active" data-layout="grid" aria-label="Grid view"><svg class="h-3.5 w-3.5" aria-hidden="true"><use href="{{ROOT}}assets/icons/lucide-sprite.svg#i-grid-2x2"></use></svg></button>
          <button type="button" class="flex h-7 w-7 items-center justify-center" data-layout="list" aria-label="List view"><svg class="h-3.5 w-3.5" aria-hidden="true"><use href="{{ROOT}}assets/icons/lucide-sprite.svg#i-list"></use></svg></button>
        </div>
      </div>

      <div class="mt-6 grid grid-cols-2 gap-3 sm:gap-4 lg:grid-cols-3" data-shop-grid data-layout="grid"></div>

      <div class="mt-10 flex justify-center">
        <button type="button" class="btn btn-outline hidden" data-load-more>
          <span data-load-label>Load more</span>
          <svg class="h-4 w-4" aria-hidden="true"><use href="{{ROOT}}assets/icons/lucide-sprite.svg#i-plus"></use></svg>
        </button>
      </div>
    </div>
  </div>
</section>

<section class="border-t border-line bg-panel section-tight">
  <div class="container-vyrox">
    <div class="flex flex-wrap items-end justify-between gap-4" data-reveal>
      <div>
        <p class="eyebrow">Recently viewed</p>
        <h2 class="section-title mt-3">PICKED UP<br>WHERE YOU LEFT OFF.</h2>
      </div>
      <button type="button" class="btn btn-ghost btn-sm text-[10px] font-bold uppercase tracking-wide2 text-subtle hover:text-red" data-recently-viewed-clear>Clear</button>
    </div>
    <div class="mt-6 grid grid-cols-2 gap-3 sm:gap-4 lg:grid-cols-4" data-recently-viewed></div>
  </div>
</section>
