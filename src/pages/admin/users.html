<!-- @title: Users — VYROX Admin @desc: Sample admin user management: staff, managers, invites, suspend/activate. @page: users -->

<div class="flex flex-wrap items-end justify-between gap-4">
  <div>
    <p class="text-[9px] font-bold uppercase tracking-brand text-subtle">System / Admin users</p>
    <h1 class="mt-1 font-display text-3xl uppercase leading-none sm:text-4xl">Users</h1>
    <p class="mt-2 text-xs text-subtle">Sample admin accounts and demo invites.</p>
  </div>
  <button type="button" class="btn btn-dark btn-sm" data-admin-invite>+ Invite user</button>
</div>

<div class="mt-5 grid gap-3 sm:grid-cols-4">
  <div class="kpi-card"><p class="text-[9px] font-bold uppercase tracking-brand text-subtle">Admin users</p><p class="kpi-value mt-2" data-admin-users-count>4</p><p class="mt-1 text-[10px] text-subtle">Sample accounts</p></div>
  <div class="kpi-card"><p class="text-[9px] font-bold uppercase tracking-brand text-subtle">Active</p><p class="kpi-value mt-2">3</p><p class="mt-1 text-[10px] text-subtle">Can sign in</p></div>
  <div class="kpi-card"><p class="text-[9px] font-bold uppercase tracking-brand text-subtle">Invited</p><p class="kpi-value mt-2">1</p><p class="mt-1 text-[10px] text-subtle">Pending invite</p></div>
</div>

<div class="mt-4 flex flex-wrap items-center gap-2 border border-line bg-surface p-3">
  <div class="relative min-w-[200px] flex-1">
    <svg class="pointer-events-none absolute left-3 top-1/2 h-3.5 w-3.5 -translate-y-1/2 text-subtle" aria-hidden="true"><use href="{{ROOT}}assets/icons/lucide-sprite.svg#i-search"></use></svg>
    <input type="search" class="input input-sm pl-9" placeholder="Name, email or role" data-admin-users-search autocomplete="off">
  </div>
</div>

<div class="admin-table-wrap mt-3">
  <table class="data-table min-w-[700px]">
    <thead><tr><th>User</th><th>Role</th><th class="hidden sm:table-cell">Level</th><th>Status</th><th class="hidden md:table-cell">Last active</th><th class="text-right">Action</th></tr></thead>
    <tbody data-admin-users-body></tbody>
  </table>
</div>

<div class="modal-backdrop" data-admin-invite-modal role="dialog" aria-modal="true" aria-labelledby="admin-invite-title">
  <div class="modal-panel max-w-md">
    <div class="flex items-start justify-between gap-3 border-b border-line p-5">
      <div><p class="text-[9px] font-bold uppercase tracking-brand text-red">Team</p><h2 id="admin-invite-title" class="font-display text-xl uppercase leading-none">Invite admin user</h2></div>
      <button type="button" class="icon-btn -mr-2 -mt-2" data-admin-invite-close aria-label="Close invite"><svg class="h-5 w-5" aria-hidden="true"><use href="{{ROOT}}assets/icons/lucide-sprite.svg#i-x"></use></svg></button>
    </div>
    <form class="space-y-4 p-5" data-admin-invite-form novalidate>
      <div><label for="in-name" class="label">Name</label><input id="in-name" name="name" type="text" class="input" placeholder="Rhea Dela Cruz" required></div>
      <div><label for="in-email" class="label">Email</label><input id="in-email" name="email" type="email" class="input" placeholder="rhea@vyrox.ph" required></div>
      <div><label for="in-role" class="label">Role</label><select id="in-role" name="role" class="input"><option value="Support">Support</option><option value="Store Manager">Store Manager</option><option value="Fulfilment">Fulfilment</option></select></div>
      <div class="flex justify-end gap-2 border-t border-line pt-4">
        <button type="button" class="btn btn-ghost btn-sm" data-admin-invite-close>Cancel</button>
        <button type="submit" class="btn btn-dark btn-sm">Send demo invite</button>
      </div>
    </form>
  </div>
</div>
