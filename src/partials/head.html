<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESC}}">
  <meta name="theme-color" content="#111111">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESC}}">
  <meta property="og:type" content="website">
  <link rel="icon" href="{{ROOT}}assets/logo/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ROOT}}assets/logo/mobile-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ROOT}}dist/css/vyrox.css">
  <script>
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('vyrox_theme_v1') || 'null');
        var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) { /* theme is cosmetic */ }
    })();
  </script>
</head>
<body data-page="{{PAGE}}" data-root="{{ROOT}}" class="bg-surface text-body">
